{{- if .Values.api.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "homenews.fullname" (dict "context" . "component" "api") }}
  labels:
    {{- include "homenews.labels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "homenews.fullname" (dict "context" . "component" "api") }}
                port:
                  name: http
{{- end }}
