apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homenews.fullname" (dict "context" . "component" "api") }}
  labels:
    {{- include "homenews.labels" (dict "context" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  # Recreate, not RollingUpdate. The scheduler is a node-cron singleton inside
  # the API process; running two pods in parallel during a rolling cutover
  # would double-fire fetch/analyze/summarize against the same DB.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "homenews.selectorLabels" (dict "context" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homenews.selectorLabels" (dict "context" . "component" "api") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Gate API startup on DB reachability. The API runs DB-dependent boot work
      # (seed defaults + resolve the fetch schedule) the instant it starts; if
      # the DB Service isn't DNS-resolvable yet (e.g. api + db restart together
      # after a node reboot) those queries fail. The app now retries, but
      # blocking here keeps the common case clean. Reuses the DB image so
      # pg_isready is available with no extra pull.
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER"; do
                echo "waiting for database $DB_HOST:$DB_PORT"
                sleep 2
              done
          env:
            - name: DB_HOST
              value: {{ include "homenews.fullname" (dict "context" . "component" "db") | quote }}
            - name: DB_PORT
              value: {{ .Values.db.service.port | quote }}
            - name: DB_USER
              value: {{ .Values.db.env.POSTGRES_USER | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.targetPort }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
