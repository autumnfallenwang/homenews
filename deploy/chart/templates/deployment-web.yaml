apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homenews.fullname" (dict "context" . "component" "web") }}
  labels:
    {{- include "homenews.labels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicaCount }}
  # No explicit strategy — k8s default RollingUpdate is correct for a stateless
  # Next.js tier. Image bumps briefly run 2 pods (maxSurge), then drop the old.
  # The api Deployment needs Recreate because of the scheduler singleton; web
  # has no equivalent constraint.
  selector:
    matchLabels:
      {{- include "homenews.selectorLabels" (dict "context" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homenews.selectorLabels" (dict "context" . "component" "web") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          # NEXT_PUBLIC_API_URL is baked into the client bundle at build time
          # (Dockerfile.web ARG), NOT passed through env at runtime — Next.js
          # inlines NEXT_PUBLIC_* values during `next build`. The GHA workflow
          # (Task 110) passes --build-arg NEXT_PUBLIC_API_URL=http://homenews-api.arch.local.
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.service.targetPort }}
              protocol: TCP
          env:
            {{- range $k, $v := .Values.web.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.web.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.web.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
